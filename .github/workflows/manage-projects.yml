name: Manage Projects

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - enable
          - disable
          - add
          - remove
      title:
        description: 'Project title (for add / remove)'
        required: false
        type: string
      description:
        description: 'Project description (for add)'
        required: false
        type: string
      tech:
        description: 'Comma-separated tech stack (for add), e.g. Java 21, Kafka, Redis'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Modify data.json
        run: |
          ACTION="${{ inputs.action }}"
          TITLE="${{ inputs.title }}"
          DESC="${{ inputs.description }}"
          TECH="${{ inputs.tech }}"

          if [ "$ACTION" = "enable" ]; then
            jq '.projects.enabled = true' data.json > tmp.json
            mv tmp.json data.json
            echo "Projects section enabled"

          elif [ "$ACTION" = "disable" ]; then
            jq '.projects.enabled = false' data.json > tmp.json
            mv tmp.json data.json
            echo "Projects section disabled"

          elif [ "$ACTION" = "add" ]; then
            if [ -z "$TITLE" ] || [ -z "$DESC" ]; then
              echo "ERROR: title and description are required for add"
              exit 1
            fi
            TECH_JSON=$(echo "$TECH" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
            jq --arg title "$TITLE" --arg desc "$DESC" --argjson tech "$TECH_JSON" \
              '.projects.items += [{"title": $title, "description": $desc, "tech": $tech}]' \
              data.json > tmp.json
            mv tmp.json data.json
            echo "Added project: $TITLE"

          elif [ "$ACTION" = "remove" ]; then
            if [ -z "$TITLE" ]; then
              echo "ERROR: title is required for remove"
              exit 1
            fi
            jq --arg title "$TITLE" \
              '.projects.items |= map(select(.title != $title))' \
              data.json > tmp.json
            mv tmp.json data.json
            echo "Removed project: $TITLE"
          fi

          echo "Current projects config:"
          jq '.projects' data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "${{ inputs.action }} project: ${{ inputs.title || 'section toggle' }}"
          git push
