name: Update Profile Image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct URL to the new profile image (Google Drive share link or any public image URL)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and replace profile image
        run: |
          URL="${{ inputs.image_url }}"

          # Convert Google Drive share links to direct download
          if echo "$URL" | grep -q "drive.google.com"; then
            FILE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+|(?<=id=)[^&]+')
            if [ -n "$FILE_ID" ]; then
              URL="https://drive.google.com/uc?export=download&id=$FILE_ID"
              echo "Converted to direct download URL for file ID: $FILE_ID"
            fi
          fi

          echo "Downloading image from: $URL"
          curl -L -o profile_new "$URL"

          # Detect file type and rename with correct extension
          MIME=$(file --mime-type -b profile_new)
          echo "Detected MIME type: $MIME"

          if [ "$MIME" = "image/jpeg" ]; then
            EXT="jpg"
          elif [ "$MIME" = "image/png" ]; then
            EXT="png"
          elif [ "$MIME" = "image/webp" ]; then
            EXT="webp"
          else
            echo "ERROR: Downloaded file is not a supported image ($MIME)"
            exit 1
          fi

          # Remove any existing profile image
          rm -f profile.jpg profile.png profile.webp

          # Save as profile.jpg (always same name)
          mv profile_new profile.jpg
          echo "Saved as profile.jpg"
          ls -lh profile.jpg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile.jpg
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "update profile image"
          git push
